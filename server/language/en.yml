mail:
  registerUser:
    subject: "User registration completed"
    text: |
      Thank you for signing up for ZpDIC Online.
      Please access the following URL to activate the user.
      This URL will expire in one hour.
      ・ {url}
  issueMyActivateToken:
    subject: "Notice on the URL for user activation"
    text: |
      Please access the following URL to activate the user.
      Note that this URL will expire in one hour.
      After it expires, you will not be able to activate the user using this URL, and you will have to go through the procedure again.
      ・ {url}
  issueUserResetToken:
    subject: "Password reset"
    text: |
      Thank you for using ZpDIC Online.
      Please access the following URL to reset your password.
      Note that this URL will expire in one hour.
      After it expires, you will not be able to reset your password using this URL, and you will have to go through the procedure again.
      ・ {url}
  contact:
    subject: "Contact: {subject}"
    text: |
      This is an inquiry from the contact form.
      ・ Name: {name} ({signedIn, select, true {authenticated: @{userName}} false {anonymous} other {}})
      ・ Email address: {email}
      ・ Subject: {subject}
      {text}
  notifyIncreaseDictionaryLimit:
    subject: "Application for a limit increase: {dictionaryName}"
    text: |
      This is an application from the limit increase form.
      ・ Applicant: @{userName} ({email})
      ・ Dictionary: {dictionaryName} (#{dictionaryNumber})
      ・ Item: {kind, select, wordCount {number of words} exampleCount {number of examples} articleCount {number of articles} other {}}
      ・ Current count: {count, number} / {limit, number}
      {message}
  receiveIncreaseDictionaryLimit:
    subject: "Your application for a limit increase has been received"
    text: |
      Your application for a limit increase has been received with the following content.
      ・ Dictionary: {dictionaryName}
      ・ Item: {kind, select, wordCount {number of words} exampleCount {number of examples} articleCount {number of articles} other {}}
      ・ Current limit: {limit, number}
      {message}

      The developer will review the content and respond individually.
      As this service is run by an individual, it may take some time before you hear back.

      ZpDIC Online is developed and maintained by an individual, and it costs tens of thousands of yen per year just to keep the service running.
      If you like, please consider supporting the development from the page below.
      Please rest assured that whether or not you offer support has no effect on whether the limit is increased or on the order in which applications are handled.
      ・ https://www.amazon.jp/hz/wishlist/ls/2WIWDYWRY374L
  notifyIncreaseUserLimit:
    subject: "Application for a limit increase: @{userName}"
    text: |
      This is an application from the limit increase form.
      ・ Applicant: @{userName} ({email})
      ・ Item: {kind, select, dictionaryCount {number of dictionaries} apiCredentialCount {number of API keys} other {}}
      ・ Current count: {count, number} / {limit, number}
      {message}
  receiveIncreaseUserLimit:
    subject: "Your application for a limit increase has been received"
    text: |
      Your application for a limit increase has been received with the following content.
      ・ Item: {kind, select, dictionaryCount {number of dictionaries} apiCredentialCount {number of API keys} other {}}
      ・ Current limit: {limit, number}
      {message}

      The developer will review the content and respond individually.
      As this service is run by an individual, it may take some time before you hear back.

      ZpDIC Online is developed and maintained by an individual, and it costs tens of thousands of yen per year just to keep the service running.
      If you like, please consider supporting the development from the page below.
      Please rest assured that whether or not you offer support has no effect on whether the limit is increased or on the order in which applications are handled.
      ・ https://www.amazon.jp/hz/wishlist/ls/2WIWDYWRY374L
